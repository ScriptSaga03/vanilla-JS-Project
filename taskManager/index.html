<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic Warrior | CRUD</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Task Master <span>v1.0</span></h1>
        <p>Manage your daily grind with localStorage</p>
      </header>

      <section class="input-section">
        <input
          type="text"
          id="taskInput"
          placeholder="Enter a new task..."
          autofocus
        />
        <button id="addBtn" class="primary-btn">Add Task</button>
      </section>

      <section class="list-section">
        <div class="list-header">
          <div class="header-top">
            <h3>Your Tasks</h3>
            <button id="clearAllBtn" class="text-btn">Clear All</button>
          </div>

          <div class="header-status">
            <span id="status-msg" class="remove"></span>
          </div>
        </div>

        <ul id="taskList"></ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
